function fileToDataURL(file,max=800,q=.72){
  return new Promise((res,rej)=>{
    if(!file||!file.type.startsWith('image/'))return rej(new Error('Please choose an image file.'));
    const fr=new FileReader();
    fr.onerror=()=>rej(new Error('Could not read the file.'));
    fr.onload=()=>{const im=new Image();

      im.src=fr.result};

function startPrivate(){
  privUnsubs.forEach(f=>f());privUnsubs=[];DB.bookings=[];DB.users=[];DB.code='';
  if(!profile&&!auth.currentUser)return;
  if(isStaff()){
    privUnsubs.push(fdb.collection('bookings').onSnapshot(s=>{DB.bookings=mapDocs(s);soft()},onErr));
    privUnsubs.push(fdb.collection('users').onSnapshot(s=>{DB.users=mapDocs(s);soft()},onErr));
    privUnsubs.push(fdb.doc('config/staff').onSnapshot(s=>{DB.code=s.exists?s.data().code:'';soft()},onErr));
  }else{
    privUnsubs.push(fdb.collection('bookings').where('customerId','==',auth.currentUser.uid).onSnapshot(s=>{DB.bookings=mapDocs(s);soft()},onErr));
  }
}
async function loadProfile(user){
  if(!user){profile=null;startPrivate();return}
  if(user.isAnonymous){profile=null;startPrivate();return}
  const s=await fdb.doc('users/'+user.uid).get();
  profile=s.exists?{id:user.uid,...s.data()}:null;
  startPrivate();
}

    try{await loadProfile(u)}catch(e){console.error(e);profile=null}
    ready=true;render();
  });
}

async function finishAuth(){
  render();
  if(afterLogin){const fn=afterLogin;afterLogin=null;fn()}
}
async function doLogin(f,role){
  busy=true;
  try{
    const c=await auth.signInWithEmailAndPassword(f.email.value.trim(),f.pw.value);
    await loadProfile(c.user);
    if(!profile||profile.role!==role){
      const other=profile?profile.role:null;
      await auth.signOut();profile=null;
      try{const g=await auth.signInAnonymously();await loadProfile(g.user)}catch(e){startPrivate()}
      toast(other?`That is a ${other} account. Use the ${other==='staff'?'Staff':'Customer'} page.`:'No account found for this email. Please sign up.','err');
      return render();
    }
    toast('Welcome, '+(profile.username||profile.name)+'!');
  }catch(e){toast(authErr(e),'err');return}
  finally{busy=false}
  finishAuth();
}
async function doSignup(f,role){
  const email=f.email.value.trim().toLowerCase(),phone=f.phone.value.trim();
  if(normPhone(phone).length<10)return toast('Enter a valid phone number.','err');
  busy=true;let cred;
  try{
    cred=await auth.createUserWithEmailAndPassword(email,f.pw.value);
    const data={role,email,phone,created:Date.now()};
    if(role==='staff'){
      data.username=f.username.value.trim();data.accessCode=f.code.value.trim();
      /* first-ever staff account sets the code; fails harmlessly if it already exists */
      try{await fdb.doc('config/staff').set({code:data.accessCode})}catch{}
    }else{data.name=f.name.value.trim();data.address=f.address.value.trim()}
    try{await fdb.doc('users/'+cred.user.uid).set(data)}
    catch(e){
      await cred.user.delete().catch(()=>{});
      busy=false;auth.signInAnonymously().catch(()=>{});
      return toast(role==='staff'&&e.code==='permission-denied'?'Wrong staff access code.':authErr(e),'err');
    }
    const keep={...data};delete keep.accessCode;
    profile={id:cred.user.uid,...keep};startPrivate();
    toast('Account created. Welcome!');
  }catch(e){busy=false;return toast(authErr(e),'err')}
  busy=false;finishAuth();
}

}

const findB=id=>DB.bookings.find(x=>x.id===id)||DB.viewed.find(x=>x.id===id);
function receiptModal(id){
  const b=findB(id);if(!b)return;
  modal('Booking '+b.ref,`<p style="margin-top:0">Print a copy, save it as PDF (choose “Save as PDF” in the print window), or download it as a file.</p>

function printReceipt(id){
  const b=findB(id),w=window.open('','_blank');
  if(!w)return toast('Allow pop-ups to print, or use Download.','err');
  w.document.write(receiptDoc(b));w.document.close();setTimeout(()=>w.print(),400);
}
function dlReceipt(id){
  const b=findB(id),a=document.createElement('a');
  a.href=URL.createObjectURL(new Blob([receiptDoc(b)],{type:'text/html'}));a.download=`Sensitivo-Booking-${b.ref}.html`;
  document.body.appendChild(a);a.click();a.remove();setTimeout(()=>URL.revokeObjectURL(a.href),2000);
}

function bindPreview(){const i=$('#fileIn');if(i)i.onchange=async()=>{if(!i.files[0])return;try{const d=await fileToDataURL(i.files[0]);const p=$('#pv');p.src=d;p.classList.remove('hide')}catch(e){toast(e.message,'err');i.value=''}}}
const fail=e=>toast('Could not save: '+(e.code==='permission-denied'?'permission denied':e.message),'err');

async function saveVehicle(f){
  const id=f.dataset.id,old=DB.vehicles.find(x=>x.id===id);let img=old?old.img:'';
  if(f.img.files[0]){try{img=await fileToDataURL(f.img.files[0],800,.72)}catch(e){return toast(e.message,'err')}}
  const v={name:f.name.value.trim(),type:f.type.value,trans:f.trans.value,seats:+f.seats.value,price:+f.price.value,status:f.status.value,img};
  try{
    if(old)await fdb.doc('vehicles/'+id).update(v);else await fdb.collection('vehicles').add({...v,created:Date.now()});
    closeModal();toast(old?'Vehicle updated.':'Vehicle added.');
  }catch(e){fail(e)}
}
async function savePrice(f){
  const id=f.dataset.id,p={item:f.item.value.trim(),cat:f.cat.value,unit:f.unit.value,amount:+f.amount.value};
  try{
    if(id)await fdb.doc('prices/'+id).update(p);else await fdb.collection('prices').add({...p,created:Date.now()});
    closeModal();toast(id?'Price updated.':'Price added.');
  }catch(e){fail(e)}
}
async function savePic(f){
  const id=f.dataset.id,old=DB.gallery.find(x=>x.id===id);let src=old?old.src:'';
  if(f.img.files[0]){try{src=await fileToDataURL(f.img.files[0],1000,.75)}catch(e){return toast(e.message,'err')}}
  if(!src)return toast('Choose a picture.','err');
  const g={title:f.title.value.trim(),src};
  try{
    if(old)await fdb.doc('gallery/'+id).update(g);else await fdb.collection('gallery').add({...g,created:Date.now()});
    closeModal();toast(old?'Picture updated.':'Picture added.');
  }catch(e){fail(e)}
}
async function saveSettings(f){
  try{
    const code=f.code.value.trim();if(code)await fdb.doc('config/staff').set({code});
    if(f.logo.files[0])await fdb.doc('settings/public').set({logo:await fileToDataURL(f.logo.files[0],400,.85)});
    toast('Settings saved.');
  }catch(e){fail(e)}
}
async function setBookingStatus(id,st){
  const b=findB(id);if(!b)return;
  try{
    const batch=fdb.batch();
    batch.update(fdb.doc('bookings/'+id),{status:st});
    if(isStaff()){
      const v=DB.vehicles.find(x=>x.id===b.vehicleId);
      if(v){
        if(st==='confirmed')batch.update(fdb.doc('vehicles/'+v.id),{status:'booked'});
        if((st==='completed'||st==='cancelled')&&!DB.bookings.some(o=>o.id!==b.id&&o.vehicleId===v.id&&o.status==='confirmed'))batch.update(fdb.doc('vehicles/'+v.id),{status:'available'});
      }
    }
    await batch.commit();return {...b,status:st};
  }catch(e){fail(e)}
}

/* ================= EVENTS ================= */
document.addEventListener('click',e=>{
  const g=e.target.closest('[data-go]');if(g){e.preventDefault();return go(g.dataset.go)}
  const el=e.target.closest('[data-act]');if(!el)return;
  const a=el.dataset.act,id=el.dataset.id;
  switch(a){
    case 'install':{const p=window.deferredInstall;if(!p)return;window.deferredInstall=null;renderNav();p.prompt();return}
    case 'theme':return setTheme(curTheme()==='light'?'dark':'light');
    case 'logout':return logout();
    case 'reset':return resetPw(el.dataset.role);
    case 'mode':authMode[el.dataset.role]=el.dataset.mode;return render();
    case 'tab':staffTab=el.dataset.tab;return render();
    case 'book':
      return bookModal(id);
    case 'copyLink':{const b=findB(id);if(!b)return;const l=bookingLink(b);return (navigator.clipboard?navigator.clipboard.writeText(l):Promise.reject()).then(()=>toast('Link copied.')).catch(()=>prompt('Copy this link:',l))}
    case 'zoom':{const gi=DB.gallery.find(x=>x.id===id);const d=document.createElement('div');d.className='lb';d.innerHTML=`<img src="${gi.src}" alt="">`;d.onclick=()=>d.remove();return document.body.appendChild(d)}
    case 'editProfile':return editProfile();
    case 'receipt':return receiptModal(id);
    case 'printReceipt':return printReceipt(id);
    case 'dlReceipt':return dlReceipt(id);
    case 'cancelBooking':return confirmBox(isStaff()?'Reject this booking?':'Cancel this booking?',async()=>{if(await setBookingStatus(id,'cancelled'))toast('Booking cancelled.')});
    case 'confirmBooking':return (async()=>{
      const b=await setBookingStatus(id,'confirmed');if(!b)return;
      const t=msgText(b,'confirmed');
      const m1=await sendEmail(b.email,'Booking confirmed '+b.ref,t);await sendEmail(CO.email,'Booking confirmed '+b.ref,t);
      if(!m1)toast('Booking confirmed, but the email to the customer could not be sent. Use Send message to try again.','err');
      notifyModal(b,'confirmed',m1)})();
    case 'resend':return (async()=>{
      const b=findB(id);if(!b)return;
      const t=msgText(b,'confirmed');
      const m1=await sendEmail(b.email,'Booking confirmed '+b.ref,t);await sendEmail(CO.email,'Booking confirmed '+b.ref,t);
      if(!m1)toast('The email could not be sent. Check the customer email address.','err');
      notifyModal(b,'confirmed',m1)})();
    case 'completeBooking':return (async()=>{if(await setBookingStatus(id,'completed'))toast('Marked as returned. Car is available again.')})();
    case 'delBooking':return confirmBox('Delete this booking record permanently?',()=>del('bookings/'+id,'Booking deleted.'));
    case 'addVehicle':return modal('Add vehicle',vehicleForm());
    case 'editVehicle':return modal('Edit vehicle',vehicleForm(DB.vehicles.find(x=>x.id===id)));
    case 'delVehicle':return confirmBox('Delete this vehicle?',()=>del('vehicles/'+id,'Vehicle deleted.'));
    case 'toggleStatus':{const v=DB.vehicles.find(x=>x.id===id),ns=v.status==='available'?'booked':'available';return fdb.doc('vehicles/'+id).update({status:ns}).then(()=>toast(v.name+' is now '+ns+'.')).catch(fail)}
    case 'addPrice':return modal('Add price',priceForm());
    case 'editPrice':return modal('Edit price',priceForm(DB.prices.find(x=>x.id===id)));
    case 'delPrice':return confirmBox('Delete this price?',()=>del('prices/'+id,'Price deleted.'));
    case 'addPic':return modal('Add picture',picForm());
    case 'editPic':return modal('Edit picture',picForm(DB.gallery.find(x=>x.id===id)));
    case 'delPic':return confirmBox('Delete this picture?',()=>del('gallery/'+id,'Picture deleted.'));
    case 'delStaff':return confirmBox('Remove this staff account? They will no longer be able to use the staff page.',()=>del('users/'+id,'Staff removed.'));
    case 'resetLogo':return del('settings/public','Logo removed.');
  }
});
document.addEventListener('submit',async e=>{
  const f=e.target.closest('form[data-form]');if(!f)return;e.preventDefault();
  const btn=f.querySelector('button:not([type=button])');if(btn){if(btn.disabled)return;btn.disabled=true}
  try{
    switch(f.dataset.form){
      case 'login':return await doLogin(f,f.dataset.role);
      case 'signup':return await doSignup(f,f.dataset.role);
      case 'book':return await submitBooking(f);
      case 'vehicle':return await saveVehicle(f);
      case 'price':return await savePrice(f);
      case 'pic':return await savePic(f);
      case 'settings':return await saveSettings(f);
      case 'profile':{
        await fdb.doc('users/'+me().id).update({name:f.name.value.trim(),phone:f.phone.value.trim(),address:f.address.value.trim()});
        Object.assign(profile,{name:f.name.value.trim(),phone:f.phone.value.trim(),address:f.address.value.trim()});
        closeModal();render();return toast('Details saved.')}
    }
  }catch(err){fail(err)}
  finally{if(btn&&document.body.contains(btn))btn.disabled=false}
});
/* ===== responsive helpers ===== */
function labelTables(){
  document.querySelectorAll('#app table').forEach(tb=>{
    const heads=[...tb.querySelectorAll('thead th')].map(th=>th.textContent.trim());
    tb.querySelectorAll('tbody tr').forEach(tr=>[...tr.children].forEach((td,i)=>{td.setAttribute('data-label',heads[i]||'');if(!td.firstElementChild||!td.firstElementChild.classList.contains('cell'))td.innerHTML='<span class="cell">'+td.innerHTML+'</span>'}));
  });
}
(function(){
  const h=document.querySelector('header.top');
  let lastY=window.scrollY,acc=0;
  addEventListener('scroll',()=>{
    const y=window.scrollY,dy=y-lastY;lastY=y;
    if(innerWidth>900||y<60){h.classList.remove('away');acc=0;return}
    if(dy===0)return;
    if((dy>0)!==(acc>0))acc=0;
    acc+=dy;
    if(acc>30&&y>120)h.classList.add('away');
    else if(acc<-30)h.classList.remove('away');
  },{passive:true});
  addEventListener('resize',()=>{if(innerWidth>900)h.classList.remove('away')});
})();
/* ===== installable app (PWA) ===== */
window.addEventListener('beforeinstallprompt',e=>{e.preventDefault();window.deferredInstall=e;renderNav()});
window.addEventListener('appinstalled',()=>{window.deferredInstall=null;renderNav();toast('App installed.')});
if('serviceWorker' in navigator&&location.protocol==='https:'){navigator.serviceWorker.register('sw.js').catch(()=>{})}
/* ===== open a booking from its link (?booking=ID) ===== */
(function(){
  const qb=new URLSearchParams(location.search).get('booking');
  if(!qb||!CONFIGURED)return;
  view='booking';
  fdb.doc('bookings/'+qb).get()
    .then(s=>{DB.viewed=s.exists?[{id:s.id,...s.data()}]:[];viewState='done';render()})
    .catch(()=>{DB.viewed=[];viewState='done';render()});
})();
render();
</script>
</body>
